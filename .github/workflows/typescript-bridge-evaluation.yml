name: TypeScript bridge evaluation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/typescript-bridge-evaluation.yml'
      - 'Tests/Tooling/evaluate-typescript-bridge.py'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Compare stock and native bridge compilers
        run: python3 Tests/Tooling/evaluate-typescript-bridge.py
